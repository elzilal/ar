<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | الظلال</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="bg-pattern" aria-hidden="true"></div>

<div class="theme-toggle-floating">
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل الوضع الليلي والنهاري" aria-pressed="false">
    <span class="theme-toggle-track">
      <span class="theme-toggle-thumb">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 1.5V4"/><path d="M12 20v2.5"/>
            <path d="M4.2 4.2L6 6"/><path d="M18 18l1.8 1.8"/>
            <path d="M1.5 12H4"/><path d="M20 12h2.5"/>
            <path d="M4.2 19.8L6 18"/><path d="M18 6l1.8-1.8"/>
          </g>
        </svg>
      </span>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="currentColor"/>
      </svg>
    </span>
  </button>
</div>

<div class="auth-page">
  <a href="index.html" class="auth-logo">
    <span class="logo-icon" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
        <circle cx="50" cy="50" r="48" fill="var(--gold)"/>
        <text x="50" y="66" text-anchor="middle" font-family="'Aref Ruqaa', serif" font-size="52" font-weight="700" fill="var(--maroon)">ظ</text>
      </svg>
    </span>
    <span class="logo-text">الظلال</span>
  </a>

  <div class="auth-card">
    <h1>أهلاً بعودتك</h1>
    <p class="auth-sub">سجّل دخولك للمتابعة في رحلتك مع اللغة العربية</p>

    <form class="auth-form" id="loginForm">
      <label>
        <span>رقم هاتف الطالب</span>
        <input type="tel" name="studentPhone" placeholder="01xxxxxxxxx" pattern="^01[0-9]{9}$" maxlength="11" required autocomplete="username">
      </label>

      <label>
        <span>كلمة المرور</span>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </label>

      <button type="submit" class="btn btn-solid auth-submit">تسجيل الدخول</button>
    </form>

    <p class="auth-switch">مالكش حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="script.js"></script>
<script>
// =========================================================
// نظام الجلسة المبسّط:
// أي تسجيل دخول جديد ناجح = يبقى فورًا هو الجلسة النشطة،
// من غير أي انتظار موافقة. الجهاز القديم (لو موجود) هيتقفل
// عليه تلقائيًا من صفحات sec*.html برسالة واضحة إنه تم تسجيل
// دخول حسابه من جهاز تاني.
// =========================================================

// لو المستخدم داخل بالفعل بجلسة صالحة، حوّله على طول لصفحته
let redirectHandled = false;
const initialAuthCheck = auth.onAuthStateChanged(async (user) => {
  initialAuthCheck();
  if (redirectHandled) return;

  if (user && user.email && user.email.endsWith('@elzilal-student.app')) {
    const phone = user.email.replace('@elzilal-student.app', '');
    try {
      const snap = await db.collection('students').doc(phone).get();
      if (snap.exists && snap.data().status === 'approved') {
        const mySessionId = localStorage.getItem('alzilal-session-id');
        const activeSessionId = snap.data().activeSessionId;
        if (mySessionId && activeSessionId && mySessionId === activeSessionId) {
          redirectHandled = true;
          const gradeToPage = { '1': 'sec1.html', '2': 'sec2.html', '3': 'sec3.html' };
          window.location.replace(gradeToPage[snap.data().grade] || 'index.html');
        }
      }
    } catch (err) {
      console.error('initial auth check failed', err);
    }
  }
});

function generateSessionId(){
  return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  const submitBtn = form.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'جاري الدخول...';

  const fakeEmail = data.studentPhone + '@elzilal-student.app';

  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const loginCred = await auth.signInWithEmailAndPassword(fakeEmail, data.password);

    const studentRef = db.collection('students').doc(data.studentPhone);
    const snap = await studentRef.get();

    if(!snap.exists){
      await auth.signOut();
      alert('حسابك غير موجود، تواصل مع الإدارة.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'تسجيل الدخول';
      return;
    }

    const student = snap.data();

    if(student.status !== 'approved'){
      await auth.signOut();
      alert('حسابك لسه قيد المراجعة، هيتفعّل بعد ما القسم يوافق عليه.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'تسجيل الدخول';
      return;
    }

    await loginCred.user.getIdToken(true);

    // نظام الجلسة الواحدة المبسّط: تسجيل الدخول الجديد يفتح جلسة
    // جديدة فورًا ويحل محل أي جلسة قديمة، من غير انتظار موافقة حد.
    const newSessionId = generateSessionId();
    await studentRef.update({
      activeSessionId: newSessionId,
      sessionRequest: firebase.firestore.FieldValue.delete()
    });
    localStorage.setItem('alzilal-session-id', newSessionId);
    localStorage.setItem('alzilal-current-student', data.studentPhone);

    redirectHandled = true;
    submitBtn.textContent = 'تم الدخول، جاري التحويل...';
    const gradeToPage = { '1': 'sec1.html', '2': 'sec2.html', '3': 'sec3.html' };
    window.location.href = gradeToPage[student.grade] || 'index.html';

  }catch(err){
    console.error(err);
    let msg = 'رقم الطالب أو كلمة المرور غير صحيحة.';
    if(err.code === 'auth/too-many-requests') msg = 'محاولات كتير غلط، حاول تاني بعد شوية.';
    if(err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'رقم الطالب أو كلمة المرور غير صحيحة.';
    alert(msg);
    submitBtn.disabled = false;
    submitBtn.textContent = 'تسجيل الدخول';
  }
});
</script>
</body>
</html>
