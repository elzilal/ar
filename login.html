<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | الظلال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="bg-pattern" aria-hidden="true"></div>

<div class="auth-page">
  <a href="index.html" class="auth-logo">
    <span class="logo-icon" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
        <circle cx="50" cy="50" r="48" fill="var(--gold)"/>
        <text x="50" y="66" text-anchor="middle" font-family="'Aref Ruqaa', serif" font-size="52" font-weight="700" fill="var(--maroon)">ظ</text>
      </svg>
    </span>
    <span class="logo-text">الظلال</span>
  </a>

  <div class="auth-card">
    <h1>أهلاً بعودتك</h1>
    <p class="auth-sub">سجّل دخولك للمتابعة في رحلتك مع اللغة العربية</p>

    <form class="auth-form" id="loginForm">
      <label>
        <span>رقم هاتف الطالب</span>
        <input type="tel" name="studentPhone" placeholder="01xxxxxxxxx" pattern="^01[0-9]{9}$" maxlength="11" required>
      </label>

      <label>
        <span>كلمة المرور</span>
        <input type="password" name="password" placeholder="••••••••" required>
      </label>

      <button type="submit" class="btn btn-solid auth-submit">تسجيل الدخول</button>
    </form>

    <p class="auth-switch">مالكش حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
  </div>
</div>

<script src="script.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());

  const students = JSON.parse(localStorage.getItem('alzilal-students') || '{}');
  const student = students[data.studentPhone];

  if(!student || student.password !== data.password){
    alert('رقم الطالب أو كلمة المرور غير صحيحة.');
    return;
  }

  localStorage.setItem('alzilal-current-student', data.studentPhone);
  alert('تم تسجيل الدخول بنجاح! أهلاً بيك يا ' + student.studentName + ' 👋');
  window.location.href = 'index.html';
});
</script>
</body>
</html>
