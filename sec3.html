<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كورسات تالتة ثانوي | الظلال</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sec.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  .session-kicked-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:20px; text-align:center; color:#fff;
  }
</style>
</head>
<body>

<div class="bg-pattern" aria-hidden="true"></div>

<!-- ============ حارس الوصول (يظهر لو مفيش صلاحية) ============ -->
<div class="access-guard" id="accessGuard" style="display:block">
  <h1 id="guardTitle">جاري التحميل...</h1>
  <p id="guardText"></p>
  <a href="login.html" class="btn btn-solid" id="guardBtn" style="display:none">تسجيل الدخول</a>
</div>

<!-- ============ الصفحة الفعلية ============ -->
<div id="pageContent" style="display:none">

  <header class="sec-header">
    <div class="sec-header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
            <circle cx="50" cy="50" r="48" fill="var(--gold)"/>
            <text x="50" y="67" text-anchor="middle" font-family="'Aref Ruqaa', serif" font-size="54" font-weight="700" fill="var(--maroon)">ظ</text>
          </svg>
        </span>
        <span class="logo-text">الظلال</span>
      </a>
      <div class="sec-header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل الوضع الليلي والنهاري" aria-pressed="false">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="5" fill="currentColor"/>
                <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M12 1.5V4"/><path d="M12 20v2.5"/>
                  <path d="M4.2 4.2L6 6"/><path d="M18 18l1.8 1.8"/>
                  <path d="M1.5 12H4"/><path d="M20 12h2.5"/>
                  <path d="M4.2 19.8L6 18"/><path d="M18 6l1.8-1.8"/>
                </g>
              </svg>
            </span>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="currentColor"/>
            </svg>
          </span>
        </button>
        <span class="student-name-chip" id="studentNameChip">—</span>
      </div>
    </div>
  </header>

  <main class="sec-page">
    <div class="section-head">
      <p class="section-eyebrow">صفحتك التعليمية</p>
      <h1>كورسات الصف الثالث الثانوي</h1>
      <p>اختار الكورس اللي عايز تشترك فيه وابدأ رحلتك</p>
    </div>

    <p class="loading-msg" id="loadingMsg">جاري تحميل الكورسات...</p>
    <p class="empty-msg" id="emptyMsg" style="display:none">لسه مفيش كورسات متاحة للصف ده حاليًا</p>

    <div class="courses-grid" id="coursesGrid"></div>

    <div class="sec-logout-wrap">
      <button class="btn btn-ghost" id="logoutBtn">تسجيل خروج</button>
    </div>
  </main>

</div>

<script src="firebase-config.js"></script>
<script src="script.js"></script>
<script>
// =========================================================
// إعداد الصفحة: كل صفحة sec لازم تغيّر السطر ده بس
// =========================================================
const PAGE_GRADE = "3";
const PAGE_LOCATION = "sec3";
const PAGE_URL_BY_GRADE = { "1": "sec1.html", "2": "sec2.html", "3": "sec3.html" };

const accessGuard = document.getElementById('accessGuard');
const pageContent = document.getElementById('pageContent');
const guardTitle = document.getElementById('guardTitle');
const guardText = document.getElementById('guardText');
const guardBtn = document.getElementById('guardBtn');

function showGuard(title, text, showLoginBtn){
  pageContent.style.display = 'none';
  accessGuard.style.display = 'block';
  guardTitle.textContent = title;
  guardText.textContent = text;
  guardBtn.style.display = showLoginBtn ? 'inline-block' : 'none';
}

function showKickedOverlay(message){
  if(document.querySelector('.session-kicked-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className = 'session-kicked-overlay';
  overlay.innerHTML = `
    <div>
      <h2 style="margin-bottom:14px">${message}</h2>
      <a href="login.html" class="btn btn-solid">تسجيل الدخول</a>
    </div>`;
  document.body.appendChild(overlay);
}

let currentStudent = null;
let currentStudentId = null;
let studentDocUnsubscribe = null;
let settled = false;

// =========================================================
// مهم جدًا: نضمن إن الجلسة بتتحفظ محليًا بشكل دائم (LOCAL)
// حتى لو الطالب دخل الصفحة دي مباشرة من غير ما يعدي بلوجين
// في نفس التاب. ده بيمنع فقدان تسجيل الدخول لما يقفل ويرجع
// يفتح التطبيق/الموقع تاني.
// =========================================================
async function checkAuth(){
  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  }catch(e){ console.error('persistence error', e); }

  // مفيش أي تايمر بيقفل بالقوة هنا. بننتظر Firebase يرد فعليًا
  // مهما استغرق، عشان مانرفضش طالب مسجل دخول فعلاً بسبب نت بطيء.
  auth.onAuthStateChanged(async (user) => {
    if(settled) return;

    if(!user){
      settled = true;
      showGuard('لازم تسجل دخول الأول', 'الصفحة دي متاحة للطلاب المسجلين والمقبولين فقط.', true);
      return;
    }

    // أحيانًا Firebase بيرجع user لكن بيانات التوكن (زي الإيميل) لسه
    // مش وصلت بالكامل. نجبر تحديث حقيقي للمستخدم بدل ما نرفضه غلط.
    if(!user.email){
      try{
        await user.reload();
        user = auth.currentUser;
      }catch(e){ console.error(e); }
    }

    if(!user || !user.email){
      // لسه معندناش بيانات كافية؛ نستنى تحديث تاني من Firebase
      // (onAuthStateChanged هيتصدى تاني تلقائيًا لو فيه تغيير حقيقي)
      return;
    }

    settled = true;

    if(!user.email.endsWith('@elzilal-student.app')){
      showGuard('الوصول غير مسموح', 'الصفحة دي مخصصة لحسابات الطلاب فقط.', false);
      return;
    }

    const phone = user.email.replace('@elzilal-student.app', '');

    try{
      const snap = await db.collection('students').doc(phone).get();
      if(!snap.exists){
        showGuard('حسابك غير موجود', 'حصل خطأ في بيانات حسابك، تواصل مع الإدارة.', false);
        return;
      }

      const student = snap.data();

      if(student.status !== 'approved'){
        showGuard('حسابك لسه قيد المراجعة', 'هيتفعّل بعد ما القسم يوافق عليه، حاول تاني بعدين.', false);
        return;
      }

      if(String(student.grade) !== String(PAGE_GRADE)){
        const correctUrl = PAGE_URL_BY_GRADE[String(student.grade)];
        const currentPage = window.location.pathname.split('/').pop();
        if(correctUrl && correctUrl !== currentPage){
          window.location.replace(correctUrl);
        }else if(!correctUrl){
          showGuard('حصل خطأ', 'صفك الدراسي غير محدد بشكل صحيح، تواصل مع الإدارة.', false);
        }
        return;
      }

      // =========================================================
      // نظام الجلسة المبسّط:
      // مصدر الحقيقة الوحيد هو مستند الطالب في القاعدة (activeSessionId).
      // لو معانا session id محفوظ محليًا ومختلف عن اللي في القاعدة،
      // معناها فيه جهاز تاني سجل دخول بعدنا -> نطلع الطالب برسالة واضحة.
      // لو معاناش session id محلي خالص، نعتمد على الجلسة الموجودة في
      // القاعدة كأساس بدل ما نرفض الطالب من حسابه بالغلط.
      // =========================================================
      let mySessionId = localStorage.getItem('alzilal-session-id');

      if(!mySessionId){
        if(student.activeSessionId){
          mySessionId = student.activeSessionId;
          localStorage.setItem('alzilal-session-id', mySessionId);
        }else{
          const newId = 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
          await db.collection('students').doc(phone).update({ activeSessionId: newId });
          mySessionId = newId;
          localStorage.setItem('alzilal-session-id', newId);
        }
      }else if(student.activeSessionId && student.activeSessionId !== mySessionId){
        // حد سجل دخول من جهاز تاني وبقى هو الجلسة النشطة
        localStorage.removeItem('alzilal-session-id');
        localStorage.removeItem('alzilal-current-student');
        auth.signOut().then(() => showKickedOverlay('تم تسجيل خروجك بسبب دخول شخص آخر لحسابك.'));
        return;
      }

      currentStudent = student;
      currentStudentId = phone;
      localStorage.setItem('alzilal-current-student', phone);
      document.getElementById('studentNameChip').textContent = student.studentName || 'الطالب';
      accessGuard.style.display = 'none';
      pageContent.style.display = 'block';
      loadCourses();
      watchSession(phone);

    }catch(err){
      console.error(err);
      showGuard('حصل خطأ', 'مقدرناش نتحقق من حسابك، حاول تاني.', false);
    }
  });
}

checkAuth();

// =========================================================
// مراقبة حية لمستند الطالب: لو حد سجل دخول من جهاز تاني أثناء
// ما إحنا فاتحين الصفحة، نطلعه فورًا برسالة واضحة.
// =========================================================
function watchSession(phone){
  studentDocUnsubscribe = db.collection('students').doc(phone).onSnapshot((snap) => {
    if(!snap.exists) return;
    const d = snap.data();
    const mySessionId = localStorage.getItem('alzilal-session-id');
    if(mySessionId && d.activeSessionId && d.activeSessionId !== mySessionId){
      if(studentDocUnsubscribe) studentDocUnsubscribe();
      localStorage.removeItem('alzilal-session-id');
      localStorage.removeItem('alzilal-current-student');
      auth.signOut().then(() => showKickedOverlay('تم تسجيل خروجك بسبب دخول شخص آخر لحسابك.'));
    }
  });
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if(!confirm('متأكد إنك عايز تسجل خروج؟')) return;
  if(studentDocUnsubscribe) studentDocUnsubscribe();
  const phone = currentStudentId;
  const mySessionId = localStorage.getItem('alzilal-session-id');
  try{
    if(phone && mySessionId){
      const ref = db.collection('students').doc(phone);
      const snap = await ref.get();
      if(snap.exists && snap.data().activeSessionId === mySessionId){
        await ref.update({ activeSessionId: firebase.firestore.FieldValue.delete() });
      }
    }
  }catch(e){ console.error(e); }
  localStorage.removeItem('alzilal-current-student');
  localStorage.removeItem('alzilal-session-id');
  auth.signOut().then(() => window.location.href = 'login.html');
});

// =========================================================
// تحميل الكورسات + حالة اشتراك الطالب في كل كورس
// (نفس شكل وحجم كروت الكورسات في الصفحة الرئيسية بالظبط)
// =========================================================
async function loadCourses(){
  const loadingMsg = document.getElementById('loadingMsg');
  const emptyMsg = document.getElementById('emptyMsg');
  const grid = document.getElementById('coursesGrid');

  loadingMsg.style.display = 'block';
  emptyMsg.style.display = 'none';
  grid.innerHTML = '';

  try{
    const coursesSnap = await db.collection('courses')
      .where('active', '==', true)
      .get();

    const courses = coursesSnap.docs
      .map(doc => ({ id: doc.id, ...doc.data() }))
      .filter(c => {
        const locs = Array.isArray(c.locations) ? c.locations : (c.location ? [c.location] : []);
        return locs.includes(PAGE_LOCATION);
      });

    const ordersSnap = await db.collection('orders')
      .where('uid', '==', auth.currentUser.uid)
      .get();

    const ordersByCourseId = {};
    ordersSnap.docs.forEach(doc => {
      const o = doc.data();
      if(o.status !== 'cancelled'){
        ordersByCourseId[o.courseId] = { id: doc.id, ...o };
      }
    });

    loadingMsg.style.display = 'none';

    if(courses.length === 0){
      emptyMsg.style.display = 'block';
      return;
    }

    grid.innerHTML = courses.map(c => renderCourseCard(c, ordersByCourseId[c.id])).join('');

    grid.querySelectorAll('.sec-cancel-btn').forEach(btn => {
      btn.addEventListener('click', () => cancelOrder(btn.dataset.orderId));
    });

  }catch(err){
    console.error(err);
    loadingMsg.textContent = 'حصل خطأ في تحميل الكورسات: ' + err.message;
  }
}

function renderCourseCard(course, order){
  let statusHtml = '';

  if(order && order.status === 'approved'){
    statusHtml = `<div class="sec-course-status"><span class="status-pill open">✓ الكورس مفتوح ليك</span></div>`;
  }else if(order && order.status === 'pending'){
    statusHtml = `
      <div class="sec-course-status">
        <span class="status-pill pending">⏳ طلبك قيد المراجعة</span>
        <button class="sec-cancel-btn" data-order-id="${order.id}">إلغاء الطلب</button>
      </div>`;
  }else if(order && order.status === 'rejected'){
    statusHtml = `
      <div class="sec-course-status">
        <span class="status-pill rejected">تم رفض الطلب السابق</span>
        <a href="enroll.html?course=${encodeURIComponent(course.id)}" class="sec-enroll-btn">إعادة الاشتراك</a>
      </div>`;
  }else{
    statusHtml = `
      <div class="sec-course-status">
        <a href="enroll.html?course=${encodeURIComponent(course.id)}" class="sec-enroll-btn">اشترك الآن</a>
      </div>`;
  }

  // نفس بنية وكلاسات كارت الكورس في الصفحة الرئيسية (course-card) عشان
  // يبقى نفس الحجم والشكل بالظبط، مع الحفاظ على حالة الاشتراك تحت السعر.
  return `
    <div class="course-card">
      ${course.image ? `<img src="${escapeHtml(course.image)}" alt="${escapeHtml(course.title || '')}" class="course-card-img" onerror="this.style.display='none'">` : ''}
      <div class="course-card-body">
        <h3>${escapeHtml(course.title || '')}</h3>
        <div class="course-price">
          <span class="amount">${escapeHtml(String(course.price ?? ''))}</span>
          <span class="currency">${escapeHtml(course.currency || 'جنيه')}</span>
        </div>
        ${statusHtml}
      </div>
    </div>
  `;
}

async function cancelOrder(orderId){
  if(!confirm('متأكد إنك عايز تلغي طلب الاشتراك ده؟')) return;
  try{
    await db.collection('orders').doc(orderId).update({ status: 'cancelled' });
    loadCourses();
  }catch(err){
    console.error(err);
    alert('حصل خطأ أثناء إلغاء الطلب: ' + err.message);
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
