<head>

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<body>

<!-- ============ هيدر مبسط ============ -->

  <div class="students-header-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
          <circle cx="50" cy="50" r="48" fill="var(--gold)"/>
          <text x="50" y="67" text-anchor="middle" font-family="'Aref Ruqaa', serif" font-size="54" font-weight="700" fill="var(--maroon)">ظ</text>
        </svg>
      </span>
      <span class="logo-text">الظلال</span>
    </a>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل الوضع الليلي والنهاري" aria-pressed="false">
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="5" fill="currentColor"/>
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 1.5V4"/><path d="M12 20v2.5"/>
                <path d="M4.2 4.2L6 6"/><path d="M18 18l1.8 1.8"/>
                <path d="M1.5 12H4"/><path d="M20 12h2.5"/>
                <path d="M4.2 19.8L6 18"/><path d="M18 6l1.8-1.8"/>
              </g>
            </svg>
          </span>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="currentColor"/>
          </svg>
        </span>
      </button>
      <a href="index.html" class="btn btn-ghost">الرئيسية</a>
    </div>
  </div>
</header>

<main class="students-page">
  <div class="section-head">
    <p class="section-eyebrow">أسرة الظلال</p>
    <h1>طلابنا الحاليين</h1>
    <p>عدد الطلاب المنضمين لينا في رحلة تعلّم اللغة العربية</p>
  </div>

  <div class="students-count-badge" id="studentsCount">جاري التحميل...</div>

  <p class="loading-msg" id="loadingMsg">جاري تحميل بيانات الطلاب...</p>
  <p class="empty-msg" id="emptyMsg" style="display:none">لسه مفيش طلاب منضمين، كن أول واحد!</p>

  <div class="students-grid" id="studentsGrid"></div>
</main>

<!-- ============ الفوتر ============ -->
<footer class="site-footer">
  <div class="footer-inner" style="grid-template-columns:1fr; text-align:center;">
    <p class="footer-copy">
      جميع الحقوق محفوظة © <span id="year"></span> الظلال —
      تطوير <a href="https://mo7amed-portfolio.github.io/dev/" target="_blank" rel="noopener">Mohamed Ashraf</a>
    </p>
  </div>
</footer>

<script src="firebase-config.js"></script>
<script src="script.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

const gradeNames = { '1': 'أولى ثانوي', '2': 'تانية ثانوي', '3': 'تالتة ثانوي' };

async function loadApprovedStudents(){
  try{
    // ملاحظة: نعرض فقط الاسم والصف الدراسي (بدون أي بيانات حساسة كرقم الهاتف)
    // بدون orderBy في الاستعلام لتفادي الحاجة لـ composite index في Firestore،
    // ونرتب البيانات في الواجهة بدلاً من ذلك
    const snap = await db.collection('students')
      .where('status', '==', 'approved')
      .get();

    const data = snap.docs.map(doc => doc.data());
    data.sort((a, b) => {
      const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });

    // نحمّل طلبات الاشتراك المفعّلة (approved) عشان نعرف كل طالب مشترك في أنهي كورسات
    // بنربط الطلب بالطالب عن طريق رقم هاتف الطالب (studentPhone)
    let ordersByPhone = {};
    try{
      const ordersSnap = await db.collection('orders')
        .where('status', '==', 'approved')
        .get();
      ordersSnap.docs.forEach(doc => {
        const o = doc.data();
        const phone = o.studentPhone;
        if(!phone) return;
        if(!ordersByPhone[phone]) ordersByPhone[phone] = [];
        if(o.courseTitle) ordersByPhone[phone].push(o.courseTitle);
      });
    }catch(err){
      console.error('حصل خطأ في تحميل الكورسات المشترك فيها الطلاب:', err);
    }

    document.getElementById('loadingMsg').style.display = 'none';
    const grid = document.getElementById('studentsGrid');
    const countBadge = document.getElementById('studentsCount');

    if(!data || data.length === 0){
      document.getElementById('emptyMsg').style.display = 'block';
      countBadge.textContent = '0 طالب منضم حاليًا';
      return;
    }

    countBadge.textContent = `${data.length} طالب منضم حاليًا`;

    grid.innerHTML = data.map(s => {
      const courses = ordersByPhone[s.studentPhone] || [];
      const coursesHtml = courses.length
        ? `<div class="student-courses">${courses.map(c => `<span class="student-course-tag">${escapeHtml(c)}</span>`).join('')}</div>`
        : `<div class="student-courses"><span class="student-course-tag student-course-tag-empty">مفيش كورس مفعّل حاليًا</span></div>`;
      return `
      <div class="student-mini-card">
        <div class="student-avatar">${(s.studentName || '?').trim().charAt(0)}</div>
        <h3>${escapeHtml(s.studentName || 'طالب')}</h3>
        <span class="student-grade-tag">${gradeNames[s.grade] || ''}</span>
        ${coursesHtml}
      </div>
    `;
    }).join('');

  }catch(err){
    console.error(err);
    document.getElementById('loadingMsg').textContent = 'حصل خطأ في تحميل البيانات.';
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadApprovedStudents();
</script>
</body>
</html>
